# 基于布丁狗订阅转换 override 改造
# 规则源: MetaCubeX/meta-rules-dat + blackmatrix7/ios_rule_script
#
# 分组策略（极简，只保留 3 个组，GLOBAL 由内核自动生成）：
# - PROXY  手动选择：AUTO / US / DIRECT
# - AUTO   全部节点按延迟自动切换，仅排除流量、到期这类信息节点
# - US     按名称前缀/关键词匹配 us 开头的节点
# 所有分组都用 include-all + filter/exclude-filter 动态匹配，
# 不写死任何具体节点名，节点增删改名都不会出现 proxy not found

# Clash Mi 兼容：未追加内置覆写时也保证内核 DNS 可用
# TUN 的启用与 DNS 劫持仍由客户端设置管理
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - "+.inorilzy.com"
    - "+.nophotonics.com"
    - "+.lan"
    - "+.local"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

proxy-groups:
  - name: PROXY
    type: select
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Static.png
    proxies:
      - AUTO
      - US
      - DIRECT

  # 自动选择：按延迟自动切换；只排除流量/到期这类信息节点，不写死任何节点名
  - name: AUTO
    type: url-test
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Urltest.png
    include-all: true
    exclude-filter: (?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置|剩余|套餐|长期有效|官网|飞机|telegram|测试
    interval: 120
    tolerance: 50

  # 美国组：按名称前缀/关键词匹配 us 开头的节点，不写死节点名
  - name: US
    type: url-test
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/US.png
    include-all: true
    exclude-filter: (?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置|剩余|套餐|长期有效|官网|飞机|telegram|测试
    filter: (?i)^us|美国|USA|🇺🇸|圣何塞|洛杉矶|San\s*Jose|Los\s*Angeles
    interval: 120
    tolerance: 50

