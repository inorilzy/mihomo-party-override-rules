rules:
  # ---- 私网/本地 IP 直连 ----
  - "IP-CIDR,10.0.0.0/8,DIRECT,no-resolve"
  - "IP-CIDR,172.16.0.0/12,DIRECT,no-resolve"
  - "IP-CIDR,192.168.0.0/16,DIRECT,no-resolve"
  - "IP-CIDR,127.0.0.0/8,DIRECT,no-resolve"
  - "IP-CIDR,100.64.0.0/10,DIRECT,no-resolve"
  - "IP-CIDR,169.254.0.0/16,DIRECT,no-resolve"
  - "IP-CIDR,224.0.0.0/4,DIRECT,no-resolve"
  - "IP-CIDR6,::1/128,DIRECT,no-resolve"
  - "IP-CIDR6,fc00::/7,DIRECT,no-resolve"
  - "IP-CIDR6,fe80::/10,DIRECT,no-resolve"
  - "RULE-SET,private,DIRECT"
  - "RULE-SET,UnBan,DIRECT"
  - "RULE-SET,BanAD,REJECT"
  - "RULE-SET,BanProgramAD,REJECT"
  # ---- 自定义规则（放在规则集之前，优先命中）----
  # 个人自建 VPS / AI 服务端直连（免代理、免 Fake-IP 虚拟网卡劫持）
  - "IP-CIDR,64.83.30.42/32,DIRECT,no-resolve"
  - "IP-CIDR,38.127.121.51/32,DIRECT,no-resolve"
  - "DOMAIN-SUFFIX,inorilzy.com,DIRECT"
  - "DOMAIN-SUFFIX,nophotonics.com,DIRECT"
  - "DOMAIN-SUFFIX,local,DIRECT"
  - "DOMAIN-SUFFIX,grok.com,PROXY"
  - "RULE-SET,grok,PROXY"
  - "RULE-SET,copilot,PROXY"
  - "RULE-SET,bard,PROXY"
  - "RULE-SET,openai,PROXY"
  - "RULE-SET,claude,PROXY"
  - "RULE-SET,SteamCN,DIRECT"
  - "RULE-SET,steam,PROXY"
  # ---- Google Play 下载修复 ----
  # googleapis.cn 会被 GeoSite CN 判为直连，但国行 Play 的服务实际走它，
  # 直连不通导致 Play 能打开能搜索、下载却一直卡在"等待中"
  - "DOMAIN-SUFFIX,googleapis.cn,PROXY"
  # Play 下载用的 Google 国内 CDN 节点（北京 2x3 / 上海 ni5 / 广州 j5o）直连更快，
  # 只匹配这几个，其余海外 CDN 节点仍按原规则走代理
  - "DOMAIN-REGEX,^r+[0-9]+(---|\\.)sn-(2x3|ni5|j5o)\\w{5}\\.xn--ngstr-lra8j\\.com$,DIRECT"
  - "RULE-SET,geolocation-!cn,PROXY"
  - "RULE-SET,cn_domain,DIRECT"
  - "RULE-SET,cn_ip,DIRECT"
  - "MATCH,PROXY"
