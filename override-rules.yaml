# 基于布丁狗订阅转换 override 改造
# 规则源: MetaCubeX/meta-rules-dat + blackmatrix7/ios_rule_script
# 分组: PROXY / AUTO(质量节点) / DOWNLOAD(折扣流量) / 地区(含折扣) / AIGC / Telegram / Google
#
# 针对当前机场节点分布优化（约 70 个真实节点）:
# - JP 19 / SG 18 / US 29 / TW 3 / HK 0
# - 约一半带 0.1倍/0.01倍；旧规则把它们踢出地区组，导致 US/JP/SG 看起来很少
# - 地区组现在保留折扣节点；AUTO 仍排除折扣，偏向日常质量线路
# - US 匹配补上 us- / 圣何塞 / 洛杉矶，兼容自建 us-zgo
# - 信息节点(剩余流量/套餐到期)继续排除

proxy-groups:
  - name: PROXY
    type: select
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Static.png
    proxies:
      - AUTO
      - 🇺🇸 US
      - 🇯🇵 JP
      - 🇸🇬 SG
      - 🇹🇼 TW
      - 🇭🇰 HK
      - DOWNLOAD
      - 其它
      - DIRECT

  # 日常自动：排除折扣/信息节点，优先三网/专线质量节点
  - name: AUTO
    type: url-test
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Urltest.png
    include-all: true
    exclude-filter: (?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置|剩余|套餐|长期有效|官网|飞机|telegram|0\.1倍|0\.01倍|下载|download
    interval: 120
    tolerance: 50

  - name: 🤖 AIGC
    type: select
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/OpenAI.png
    proxies:
      - 🇯🇵 JP
      - 🇸🇬 SG
      - 🇺🇸 US
      - AUTO
      - DIRECT

  - name: Telegram
    type: select
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Telegram.png
    proxies:
      - 🇸🇬 SG
      - 🇯🇵 JP
      - 🇭🇰 HK
      - 🇺🇸 US
      - AUTO

  - name: Google
    type: select
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Google.png
    proxies:
      - 🇭🇰 HK
      - 🇹🇼 TW
      - 🇯🇵 JP
      - 🇸🇬 SG
      - 🇺🇸 US
      - AUTO

  # 地区组：保留 0.1/0.01 倍节点，只排除信息/广告假节点
  - name: 🇭🇰 HK
    type: url-test
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/HK.png
    include-all: true
    exclude-filter: (?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置|剩余|套餐|长期有效|官网|飞机|telegram
    filter: (?i)香港|Hong\s*Kong|🇭🇰|(?:^|[^A-Za-z0-9])HK(?:[^A-Za-z0-9]|$)
    interval: 120
    tolerance: 50

  - name: 🇹🇼 TW
    type: url-test
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/TW.png
    include-all: true
    exclude-filter: (?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置|剩余|套餐|长期有效|官网|飞机|telegram
    filter: (?i)台湾|臺灣|Taiwan|🇹🇼|(?:^|[^A-Za-z0-9])TW(?:[^A-Za-z0-9]|$)
    interval: 120
    tolerance: 50

  - name: 🇸🇬 SG
    type: url-test
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/SG.png
    include-all: true
    exclude-filter: (?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置|剩余|套餐|长期有效|官网|飞机|telegram
    filter: (?i)新加坡|Singapore|🇸🇬|(?:^|[^A-Za-z0-9])SG(?:[^A-Za-z0-9]|$)
    interval: 120
    tolerance: 50

  - name: 🇺🇸 US
    type: url-test
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/US.png
    include-all: true
    exclude-filter: (?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置|剩余|套餐|长期有效|官网|飞机|telegram
    # 兼容: 美国/USA/🇺🇸/us-zgo/圣何塞/洛杉矶
    filter: (?i)美国|USA|🇺🇸|圣何塞|洛杉矶|San\s*Jose|Los\s*Angeles|(?:^|[^A-Za-z0-9])US(?:[^A-Za-z0-9]|$)
    interval: 120
    tolerance: 50

  - name: 🇯🇵 JP
    type: url-test
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/JP.png
    include-all: true
    exclude-filter: (?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置|剩余|套餐|长期有效|官网|飞机|telegram
    filter: (?i)日本|Japan|🇯🇵|东京|東京|Tokyo|(?:^|[^A-Za-z0-9])JP(?:[^A-Za-z0-9]|$)
    interval: 120
    tolerance: 50

  # 折扣/下载专用；大文件、不在乎延迟时用
  - name: DOWNLOAD
    type: url-test
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Thunder.png
    include-all: true
    exclude-filter: (?i)剩余流量|套餐到期|Traffic|Expire|Premium|频道|订阅|ISP|长期有效|官网
    filter: (?i)0\.1倍|0\.01倍|下载|download
    interval: 120
    tolerance: 50

  # 未落入常见地区关键词的节点（如特殊命名自建）
  - name: 其它
    type: select
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Static.png
    include-all: true
    exclude-filter: (?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置|剩余|套餐|长期有效|官网|飞机|telegram|香港|Hong\s*Kong|🇭🇰|(?:^|[^A-Za-z0-9])HK(?:[^A-Za-z0-9]|$)|台湾|臺灣|Taiwan|🇹🇼|(?:^|[^A-Za-z0-9])TW(?:[^A-Za-z0-9]|$)|新加坡|Singapore|🇸🇬|(?:^|[^A-Za-z0-9])SG(?:[^A-Za-z0-9]|$)|美国|USA|🇺🇸|圣何塞|洛杉矶|San\s*Jose|Los\s*Angeles|(?:^|[^A-Za-z0-9])US(?:[^A-Za-z0-9]|$)|日本|Japan|🇯🇵|东京|東京|Tokyo|(?:^|[^A-Za-z0-9])JP(?:[^A-Za-z0-9]|$)

